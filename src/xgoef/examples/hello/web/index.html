<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>xgoef hello</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1f16;
        --paper: #f3efe6;
        --accent: #2f6f4e;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #d9e7dd 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #efe6d4 0%, transparent 50%),
          var(--paper);
        color: var(--ink);
        display: grid;
        place-items: center;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-weight: 600;
        letter-spacing: 0.04em;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        opacity: 0.8;
      }
      button {
        font: inherit;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #f7fff9;
        padding: 0.55rem 1.1rem;
        cursor: pointer;
      }
      #out {
        margin-top: 1rem;
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>xgoef</h1>
      <p>XGo · LLGo · CEF — Tauri-shaped desktop shell</p>
      <button id="btn" type="button">invoke greet</button>
      <div id="out">waiting for host</div>
    </main>
    <script src="../../../api/js/xgoef.js"></script>
    <script>
      const out = document.getElementById("out");
      document.getElementById("btn").onclick = async () => {
        try {
          const msg = await window.__XGOEF__.invoke("greet", { name: "xgo" });
          out.textContent = String(msg);
        } catch (e) {
          out.textContent = e.message || String(e);
        }
      };
    </script>
  </body>
</html>
